<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Revenez plus tard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    color: #fff;
    font-family: 'Inter', sans-serif;
    text-align: center;
  }
  
  h1 {
    font-size: 2.5rem;
    letter-spacing: 2px;
    margin: 0;
  }
  p {
    color: #888;
    margin-top: 10px;
  }

  #dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}
@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

footer {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
}
footer a {
  color: #888;
  text-decoration: none;
  font-size: 0.9rem;
  border: 1px solid #333;
  padding: 6px 14px;
  border-radius: 20px;
  transition: 0.2s;
}
footer a:hover {
  color: #fff;
  border-color: #666;
}
</style>
</head>
<body>
  <div>
    <h1>Revenez plus tard !</h1>
    <p>Maintenance en cours<span id="dots"></span><br>
Plus d'informations sur la page de status ci-dessous.</p>
  </div>
</body>
<footer>
  <a href="https://status.natolix.me">Status</a>
</footer>
</html>
